apiVersion: v1
kind: Service
metadata:
  name: sample-service
spec:
  type: NodePort  # Expose outside the cluster
  selector:
    app: sample-portfolio
  ports:
  - protocol: TCP
    port: 80        # Port inside the cluster
    targetPort: 80  # Port on the container
    nodePort: 30080 # Port to access from outside (30000-32767 range)
